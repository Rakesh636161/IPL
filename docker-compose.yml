services:
  postgres:
    image: postgres:16-alpine
    container_name: cricketverse_postgres
    environment:
      POSTGRES_USER: ${SQL_ADMIN_USER:-cricketverse_admin}
      POSTGRES_PASSWORD: ${SQL_ADMIN_PASSWORD:-cricketverse_secret}
      POSTGRES_DB: ${SQL_DB_NAME:-cricketverse}
    ports:
      - '5432:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${SQL_ADMIN_USER:-cricketverse_admin}']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cricketverse_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      SQL_HOST: postgres
      SQL_DB_NAME: ${SQL_DB_NAME:-cricketverse}
      SQL_USER: ${SQL_ADMIN_USER:-cricketverse_admin}
      SQL_PASSWORD: ${SQL_ADMIN_PASSWORD:-cricketverse_secret}
      SQL_ADMIN_USER: ${SQL_ADMIN_USER:-cricketverse_admin}
      SQL_ADMIN_PASSWORD: ${SQL_ADMIN_PASSWORD:-cricketverse_secret}
    ports:
      - '3000:3000'

volumes:
  pg_data:
